[project]
name = "qc-leap-backend"
version = "1.0.0"
description = "Generative Quality Control Agent for Data-Scarce Environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # FastAPI and server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",

    # Authentication and Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",

    # Validation
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Redis caching
    "redis>=5.0.1",
    "hiredis>=2.3.2",

    # Utilities
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
ml = [
    # AI/ML libraries (install when needed for Sprint 3+)
    "torch>=2.1.2",
    "torchvision>=0.16.2",
    "transformers>=4.36.2",
    "pillow>=10.2.0",
    "numpy>=1.26.3",
    "opencv-python>=4.9.0.80",
]

dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.26.0",
    "ruff>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
# Ensures pytest-asyncio runs asynchronous tests/fixtures
asyncio_mode = "auto"